  <body>
    <div id="root">
      <div class="kf-form">
        <div class="bg"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>
        <main class="app">
          <!-- ===== FAIXA VERMELHA (esquerda no computador, topo no celular) =====
               Pode editar os textos abaixo. As 4 etapas: o texto principal vem
               antes do <small>, o subtítulo fica dentro do <small>. -->
          <aside class="brand">
            <img class="logo" src="assets/logo-branco.png" alt="King of Languages" />
            <h1>Faça parte do <span class="hl">time King</span> de vendas</h1>
            <p class="lead">Processo seletivo 100% online para o nosso time comercial. Rápido e direto ao ponto.</p>
            <div class="steps">
              <div class="stp active"><span class="dot">1</span><span class="lbl">Formulário<small>alguns minutos</small></span></div>
              <div class="stp"><span class="dot">2</span><span class="lbl">Análise do perfil<small>nosso time avalia</small></span></div>
              <div class="stp"><span class="dot">3</span><span class="lbl">Vídeo curto<small>gravado no celular</small></span></div>
              <div class="stp"><span class="dot">4</span><span class="lbl">Entrevista<small>com o time comercial</small></span></div>
            </div>
            <div class="spacer"></div>
            <div class="proof">+9 mil alunos ativos</div>
          </aside>
          <!-- ===== FIM DA FAIXA VERMELHA ===== -->

          <section class="form">
            <div class="fhead">
              <button class="back" type="button" aria-label="Voltar"><svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>Voltar</button>
              <div class="progress"><i style="width: 5%"></i></div>
              <span class="counter">Vamos começar</span>
            </div>
            <!-- As telas são montadas por assets/form.js -->
            <div class="screens"></div>
          </section>
        </main>
      </div>
    </div>
